spring:
  application:
    name: ${PROXY_APP_NAME:SingiAttend-Student_Proxy}

eureka:
  client:
    enabled: ${EUREKA_DISCOVERY_ENABLE:false}
    register-with-eureka: ${EUREKA_SHOULD_REGISTER:false}
    fetch-registry: ${EUREKA_FETCH_REGISTRY:false}
    service-url:
      defaultZone: ${EUREKA_DEFAULT:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${eureka.instance.hostname}:${server.port}
    metadata-map:
      support-team: MarkoDojkic
      version: '@project.version@'
    non-secure-port-enabled: false
    secure-port-enabled: true
    non-secure-port: ${server.port}
    status-page-url: https://${eureka.instance.hostname}:${server.port}/actuator/info
    health-check-url: https://${eureka.instance.hostname}:${server.port}/health
    home-page-url: https://${eureka.instance.hostname}:${server.port}/

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      enabled: true
    info:
      enabled: true

server:
  port: ${PROXY_PORT:62814}
  http2:
    enabled: true
  ssl:
    key-store: classpath:ssl_keystore-signed.p12
    key-store-type: PKCS12
    key-store-password: ${PROXY_SERVER_SSL_KEY_STORE_PASSWORD}
    key-password: ${PROXY_SERVER_SSL_KEY_PASSWORD}
    enabled: true
    enabled-protocols: TLSv1.2,TLSv1.3
    protocol: TLS

feign:
  singiattend:
    server_client: ${PROXY_FEIGN_SINGIATTEND_CLIENT:SINGIATTEND-SERVER}
