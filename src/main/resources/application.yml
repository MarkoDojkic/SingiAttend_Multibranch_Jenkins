spring:
  application:
    name: ${PROXY_APP_NAME:SingiAttend-Student_Proxy}
  main:
    allow-circular-references: true
    cloud-platform: kubernetes
  cloud:
    compatibility-verifier:
      enabled: false #Spring Boot 4.1.x not yet set as compatible with spring cloud 2025.1.1
    kubernetes:
      discovery:
        enabled: true
      client:
        namespace: ${KUBERNETES_NAMESPACE:default}
    loadbalancer:
      simple:
        health-check-path: ${feign_client.path}/actuator/health
        scheme: https
        secure: true


management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      cors:
        allowed-origins: "*"
  endpoint:
    health:
      enabled: true
      probes:
        enabled: true
    info:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      version: ${project.version}

server:
  servlet:
    context-path: ${PROXY_APP_CONTEXT_PATH:}
  port: ${PROXY_PORT:62814}
  http2:
    enabled: true
  ssl:
    key-store: classpath:ssl_keystore-signed.p12
    key-store-type: PKCS12
    key-store-password: ${PROXY_SERVER_SSL_KEY_STORE_PASSWORD}
    key-password: ${PROXY_SERVER_SSL_KEY_PASSWORD}
    enabled: true
    enabled-protocols: TLSv1.2,TLSv1.3
    protocol: TLS

feign_client:
  name: ${PROXY_FEIGN_CLIENT_NAME:singiattend-server}
  url: ${PROXY_FEIGN_CLIENT_URL:}
  path: ${PROXY_FEIGN_CLIENT_PATH:}
  context-id: ${PROXY_FEIGN_CONTEXT_ID:singiattend-server-client}