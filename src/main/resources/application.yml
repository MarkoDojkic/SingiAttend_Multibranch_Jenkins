spring:
  profiles:
    default: dev
  config:
    activate:
      on-profile: dev, kubernetes
  application:
    name: ${APP_NAME:SingiAttend-Student_Proxy}
  cloud:
    compatibility-verifier:
      enabled: false #Spring Boot 4.1.x not yet set as compatible with spring cloud 2025.1.1
    openfeign:
      http2client:
        enabled: true
  threads:
    virtual:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      cors:
        allowed-origins: "*"
  endpoint:
    health:
      enabled: true
      probes:
        enabled: true
    info:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      version: ${project.version}

server:
  servlet:
    context-path: ${APP_CONTEXT_PATH:}
    session:
      cookie:
        path: / # Required when context-path is different in case of rewrites to keep SAML session cookie same
  port: ${PORT:62814}
  http2:
    enabled: true
  ssl:
    trust-store: classpath:truststore.jks
    trust-store-password: ${SSL_TRUST_STORE_PASSWORD}
    trust-store-type: JKS
    key-store: classpath:ssl_keystore-signed.p12
    key-store-type: PKCS12
    key-store-password: ${SSL_KEY_STORE_PASSWORD}
    key-password: ${SSL_KEY_PASSWORD}
    enabled: true
    enabled-protocols: TLSv1.2,TLSv1.3
    protocol: TLS

iam:
  saml:
    relayingParties: ${IAM_SAML_RELAYING_PARTIES}
  ssl:
    truststore:
      path: classpath:saml/iam-truststore.p12
      password: ${IAM_SSL_TRUSTSTORE_PASSWORD}
      type: PKCS12
feign_client:
  backend:
    username: ${BACKEND_USERNAME}
    password: ${BACKEND_PASSWORD}
---
spring:
  config:
    activate:
      on-cloud-platform: kubernetes
  cloud:
    kubernetes:
      discovery:
        enabled: true
        primary-port-name: 'https'
        known-secure-ports: 62812
      client:
        namespace: ${KUBERNETES_NAMESPACE:default}
      loadbalancer:
        port-name: 'https'
        mode: SERVICE

feign_client:
  name: ${FEIGN_CLIENT_NAME:singiattend-server}
  url:
  path: ${FEIGN_CLIENT_PATH:}
  context-id: ${FEIGN_CONTEXT_ID:singiattend-server-client}
---
spring:
  config:
    activate:
      on-profile: dev
  cloud:
    kubernetes:
      discovery:
        enabled: false

feign_client:
  name: ${FEIGN_CLIENT_NAME:singiattend-server}
  url: ${FEIGN_CLIENT_URL:}
  path: ${FEIGN_CLIENT_PATH:}
  context-id: ${FEIGN_CONTEXT_ID:singiattend-server-client}