---
apiVersion: v1
kind: Namespace
metadata:
  name: nexus
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mongodb-pv
  namespace: nexus
spec:
  capacity:
    storage: 10Gi  # Size of the persistent storage
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce  # Only one pod can mount the volume for writing
  storageClassName: standard  # Make sure this matches the PVC storageClassName
  hostPath:  # Local storage example (change this for cloud environments)
    path: /mnt/data/mongodb  # Directory on the node to mount as the volume
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-pvc
  namespace: nexus
spec:
  accessModes:
    - ReadWriteOnce  # Ensure it matches the PV access mode
  resources:
    requests:
      storage: 10Gi  # Requested size of the PVC (must be equal or smaller than the PV size)
  storageClassName: standard  # Ensure this matches the PV's storage class
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: singiattend-mongo
  namespace: nexus
spec:
  replicas: 1  # Number of pods for MongoDB (should be > 0 to run)
  selector:
    matchLabels:
      app: singiattend-mongo
  template:
    metadata:
      labels:
        app: singiattend-mongo
    spec:
      containers:
        - name: singiattend-mongo
          image: host.lima.internal:8081/singiattend-mongo:latest  # Use your MongoDB image here
          ports:
            - containerPort: 27017
              name: singiattend-db
              protocol: TCP
          volumeMounts:
            - mountPath: /data/db  # MongoDB's data directory
              name: mongodb-storage
      imagePullSecrets:
        - name: nexus-creds
      volumes:
        - name: mongodb-storage
          persistentVolumeClaim:
            claimName: mongodb-pvc  # The PVC to bind to
---
apiVersion: v1
kind: Service
metadata:
  name: singiattend-mongo-service
  namespace: nexus
spec:
  ports:
    - name: singiattend-db
      port: 62810  # External port for accessing MongoDB
      protocol: TCP
      targetPort: 27017  # MongoDB's internal port
  selector:
    app: singiattend-mongo
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: singiattend
  namespace: nexus
spec:
  replicas: 1  # Ensure this is > 0 to start the app
  selector:
    matchLabels:
      app: singiattend
  template:
    metadata:
      labels:
        app: singiattend
    spec:
      containers:
        - name: singiattend
          image: host.lima.internal:5001/singiattend-appstack:latest
          ports:
            - containerPort: 443
              name: singiattend-fe
              protocol: TCP
            - containerPort: 62811
              name: singiattend-be
              protocol: TCP
            - containerPort: 62814
              name: singiattend-sp
              protocol: TCP
            - containerPort: 8761
              name: eureka-server
              protocol: TCP
          envFrom:
            - configMapRef:
                name: singiattend-cm
          env:
            - name: MONGO_HOST
              value: "singiattend-mongo-service:62810"  # Ensure this points to the MongoDB service
          volumeMounts:
            - mountPath: /app/config
              name: config-volume
      imagePullSecrets:
        - name: nexus-creds
      volumes:
        - name: config-volume
          configMap:
            name: singiattend-cm
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: singiattend-cm
  namespace: nexus
data:
  APP_NAME: singiattend-server
  EUREKA_DEFAULT: http://singiattend-service:8761/eureka
  EUREKA_DISCOVERY_ENABLE: "true"
  EUREKA_FETCH_REGISTRY: "true"
  EUREKA_HOSTNAME: singiattend-service.nexus.svc.cluster.local
  EUREKA_SHOULD_REGISTER: "true"
  MONGO_HOST: singiattend-mongo-service:62810  # This points to the MongoDB service
  PORT: "62811"
  PROXY_APP_NAME: singiattend-student-proxy
  PROXY_FEIGN_SINGIATTEND_CLIENT: singiattend-server
  PROXY_PORT: "62814"
  TENANTS: |
    [
      {"tenantId":"SingidunumBG","db":"SingiAttend_BG"},
      {"tenantId":"SingidunumNS","db":"SingiAttend_NS"},
      {"tenantId":"SingidunumNIS","db":"SingiAttend_NIS"}
    ]
---
apiVersion: v1
kind: Service
metadata:
  name: singiattend-service
  namespace: nexus
spec:
  ports:
    - name: singiattend-fe
      port: 62812
      protocol: TCP
      targetPort: 443
    - name: singiattend-be
      port: 62811
      protocol: TCP
      targetPort: 62811
    - name: singiattend-sp
      port: 62814
      protocol: TCP
      targetPort: 62814
    - name: eureka-server
      port: 8761
      protocol: TCP
      targetPort: 8761
  selector:
    app: singiattend
  sessionAffinity: None
  type: ClusterIP
