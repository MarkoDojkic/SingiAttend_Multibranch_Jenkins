<style>
    .captcha-wrapper {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .captcha-error {
        color: red;
        font-size: 14px;
        min-height: 18px; /* avoids layout shift */
    }
</style>
<script>
    async function onTurnstileCallback(token) {
        const loginBtn = document.getElementById('formLoginBtn');
        const samlLoginBtn = document.getElementById('samlLoginBtn');
        if (!samlLoginBtn) {
            console.error('SAML login button not found!');
            return;
        } else if (!loginBtn) {
            console.error('Login button not found!');
            return;
        }

        try {
            const response = await fetch('static/core/cloudflare_turnstile_verification.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest'
                },
                body: JSON.stringify({ token })
            });

            const data = await response.json();
            if (data.success) {
                // enable the link: transfer data-href into href and remove disabled state
                const realHref = samlLoginBtn.dataset.href;
                if (realHref) samlLoginBtn.setAttribute('href', realHref);
                samlLoginBtn.classList.remove('disabled');
                samlLoginBtn.setAttribute('aria-disabled', 'false');
                loginBtn.classList.remove('disabled');
                loginBtn.setAttribute('aria-disabled', 'false');
                document.getElementById('captchaError').style.display = 'none';
            } else {
                document.getElementById('captchaError').style.display = 'block';
            }

        } catch (error) {
            console.error('Error verifying token:', error);
            document.getElementById('captchaError').style.display = 'block';
        }
    }

    fetch('/static/core/set-timezone.php', {
        method: 'POST',
        body: JSON.stringify({ timezone: Intl.DateTimeFormat().resolvedOptions().timeZone }),
        headers: { 'Content-Type': 'application/json' }
    });
</script>

<div class="card text-center" style="width: 36rem; margin:0px auto; font-size: 1.2em;">
    <div class="card-header">
        {HEADER_TITLE}
    </div>
    <div class="card-body">
        <br>
        <form target="phpIframe" action="{FORM_ACTION}" method="post">
            <div class="form-group">
                <input type="text" class="form-control" name="id" placeholder="{id}">
            </div>
            <div class="form-group">
                <input type="password" class="form-control" name="password" placeholder="{password}">
            </div>
            <div class="form-group">
                <div class="form-check form-check-inline">
                    <label class="form-check-label">
                        <input class="form-check-input" type="radio" name="proxyIdentifier" value="SingidunumBG"> {bg}
                    </label>
                    <label class="form-check-label">
                        <input class="form-check-input" type="radio" name="proxyIdentifier" value="SingidunumNS"> {ns}
                    </label>
                    <label class="form-check-label">
                        <input class="form-check-input" type="radio" name="proxyIdentifier" value="SingidunumNIS"> {nis}
                    </label>
                </div>
            </div>
            <div class="captcha-wrapper">
                <div class="cf-turnstile form-group"
                     data-sitekey="{CLOUDFLARE_SITE_KEY}"
                     data-theme="light"
                     data-callback="onTurnstileCallback">
                </div>

                <div id="captchaError" class="captcha-error">{CLOUDFLARE_FAILED_ERROR}</div>
            </div>
            <div class="form-group">
                <br>
                <button id="formLoginBtn" type="submit" class="btn btn-success disabled" aria-disabled="true">{LOGIN}</button>
                <button type="reset" class="btn btn-danger">{RESET}</button>
                <a id="samlLoginBtn" class="btn btn-primary disabled" href="#" data-href="{SAML_LOGIN_HREF}" role="button" aria-disabled="true">{SAML_LOGIN}</a>
            </div>
        </form>
    </div>
    <br>
    <iframe id="phpIframe" name="phpIframe" src="" class="card-footer text-muted" height="90rem"></iframe>
    <br>
</div>
