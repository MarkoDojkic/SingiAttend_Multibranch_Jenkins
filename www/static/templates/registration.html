<style>
    .captcha-wrapper {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .captcha-error {
        color: red;
        font-size: 14px;
        min-height: 18px; /* avoids layout shift */
    }
</style>
<script>
    async function onTurnstileCallback(token) {
        const registerBtn = document.getElementById('registerBtn');
        if (!registerBtn) {
            console.error('Register button not found!');
            return;
        }

        try {
            const response = await fetch('static/core/cloudflare_turnstile_verification.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest'
                },
                body: JSON.stringify({ token })
            });

            const data = await response.json();
            if (data.success) {
                registerBtn.classList.remove('disabled');
                registerBtn.setAttribute('aria-disabled', 'false');
            } else {
                document.getElementById('captchaError').style.display = 'block';
            }

        } catch (error) {
            console.error('Error verifying token:', error);
            document.getElementById('captchaError').style.display = 'block';
        }
    }
</script>
<div class="card text-center" style="width: 36rem; margin:0px auto; font-size: 1.2em;">
    <div class="card-header">
        {HEADER_TITLE}
    </div>
    <div class="card-body">
        <br>
        <form target="phpIframe" action="{FORM_ACTION}" method="post" enctype="multipart/form-data"> <!-- enctype is used to upload files -->
            <div class="form-group" style="display: inline-flex; margin-left: -50%; width: 200%;">
                <input type="text" class="form-control" style="margin-right: 2%;" name="nameSurname" placeholder="{nameSurname}">
                <input type="text" class="form-control" name="singidunumMail" placeholder="{email}">
            </div>
            <div class="form-group" style="display: inline-flex; margin-left: -50%; width: 200%;">
                <input type="password" class="form-control" style="margin-right: 2%;" name="password" placeholder="{password}">
                <input type="password" class="form-control" name="passwordConfirm" placeholder="{passwordConfirm}">
            </div>
            <div class="form-group">
                <div class="form-check form-check-inline">
                    <label class="form-check-label">
                        <input class="form-check-input" type="radio" name="registerAs" value="professor"> {professor}&emsp;
                    </label>
                    <label class="form-check-label">
                        <input class="form-check-input" type="radio" name="registerAs" value="assistant"> {assistant}
                    </label>
                </div>
            </div>
            <div class="form-group">
                <div class="form-check form-check-inline">
                    <label class="form-check-label">
                        <input class="form-check-input" type="radio" name="proxyIdentifier" value="SingidunumBG"> {bg}&emsp;
                    </label>
                    <label class="form-check-label">
                        <input class="form-check-input" type="radio" name="proxyIdentifier" value="SingidunumNS"> {ns}
                    </label>
                    <label class="form-check-label">
                        <input class="form-check-input" type="radio" name="proxyIdentifier" value="SingidunumNIS"> {nis}
                    </label>
                </div>
            </div>
            <div class="captcha-wrapper">
                <div class="cf-turnstile form-group"
                     data-sitekey="{CLOUDFLARE_SITE_KEY}"
                     data-theme="light"
                     data-callback="onTurnstileCallback">
                </div>

                <div id="captchaError" class="captcha-error">{CLOUDFLARE_FAILED_ERROR}</div>
            </div>
            <div style="display: -webkit-inline-box; margin-left: -30%;">
                {CSV_MESSAGE} &nbsp;&nbsp;
                <input type="file" id="csv_newUsersList" name="csv_newUsersList" 
                accept=".csv" value="{CSV_BUTTON}"></input>
            </div>
            <div class="form-group">
                <br>
                <input id="registerBtn" type="submit" class="btn btn-success disabled" aria-disabled="true" value="{REGISTER}"></input>
                <input type="reset" class="btn btn-danger" value="{RESET}"></input>
            </div>
        </form>
    </div>
    <br>
    <iframe id="phpIframe" name="phpIframe" src="" class="card-footer text-muted" height="90rem"></iframe>
    <br>
</div>
